name: prisma-deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # A blank PRISMA_SERVICE_TOKEN overrides the OIDC exchange and fails with
      # AUTH.SERVICE_TOKEN_EMPTY, so only export it when the secret is set.
      - name: Export PRISMA_SERVICE_TOKEN when configured
        env:
          TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "PRISMA_SERVICE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          fi
      - uses: prisma/cloud-deploy-action@v1
        with:
          install-command: pnpm install --frozen-lockfile
          module: module.mjs
          build-command: pnpm run build
